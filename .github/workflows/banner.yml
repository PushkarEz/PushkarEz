name: Update Time-Aware Pixel Banner

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate banner.svg
        run: python scripts/generate_banner.py
      - name: Commit updated banner.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner.svg
          git diff --staged --quiet || (git commit -m "chore: update pixel banner for IST time" && git push)
